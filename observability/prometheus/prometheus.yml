global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'ticket-in-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000', 'localhost:3000']
        labels:
          application: 'ticket-in'
          environment: 'production-simulation'
