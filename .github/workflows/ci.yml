name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. TypeScript Strict Typecheck
        run: pnpm run typecheck

      - name: 2. ESLint Flat Config
        run: pnpm run lint

      - name: 3. Prettier Format Verification
        run: pnpm run format:check

      - name: 4. Architectural Boundary Guardrails (dependency-cruiser)
        run: pnpm run depcruise

      - name: 5. Vitest Unit Test Suite
        run: pnpm test

      - name: 6. Production Build (tsc)
        run: pnpm run build
